# Land the Plane™ v1.1 — Workflow 02
name: Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      python: ${{ steps.f.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/quality-gate.yml'
            python:
              - 'agents/**'
              - 'harness/**'
              - 'packages/lightning/**'
              - 'packages/lightrag/**'
              - 'apps/api/**'

  typecheck:
    name: TypeScript — zero errors
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test --if-present

  build:
    name: Build — web
    needs: [typecheck, lint, test]
    if: always() && !failure()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_WEB_URL: http://localhost:3001
          NEXT_TELEMETRY_DISABLED: 1

  geo-gate:
    name: GEO compliance
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: llms.txt present + non-empty
        run: |
          test -f apps/web/public/llms.txt || { echo "❌ llms.txt missing"; exit 1; }
          [ $(wc -c < apps/web/public/llms.txt) -gt 100 ] || { echo "❌ llms.txt too small (<100 bytes)"; exit 1; }
          echo "✅ llms.txt: $(wc -c < apps/web/public/llms.txt) bytes"
      - name: AI bots allowed in robots.ts
        run: |
          ROBOTS="apps/web/app/[locale]/robots.ts"
          grep -q "GPTBot"        "$ROBOTS" || { echo "❌ GPTBot missing from robots.ts";        exit 1; }
          grep -q "ClaudeBot"     "$ROBOTS" || { echo "❌ ClaudeBot missing from robots.ts";     exit 1; }
          grep -q "PerplexityBot" "$ROBOTS" || { echo "❌ PerplexityBot missing from robots.ts"; exit 1; }
          echo "✅ All AI bots allowed"
      - name: JSON-LD in layout
        run: |
          grep -q "application/ld+json" "apps/web/app/[locale]/layout.tsx" \
            || { echo "❌ JSON-LD missing from layout.tsx"; exit 1; }
          echo "✅ JSON-LD present"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets in source
        run: |
          if grep -rE "(sk-ant-[a-zA-Z0-9]{20,}|sk_live_[a-zA-Z0-9]{20,}|AIza[0-9A-Za-z-_]{35})" \
            apps/ packages/ agents/ harness/ \
            --include="*.ts" --include="*.tsx" --include="*.py" \
            | grep -v ".env" | grep -v node_modules; then
            echo "🔴 Secret detected in source — rotate immediately"
            exit 1
          fi
          echo "✅ No secrets in source"

  stub-scan:
    name: Stub scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No stubs in production code
        run: |
          STUBS=$(grep -rn \
            "TODO\|Not implemented\|# TODO\|return None$\|_ = run_data\|_ = filters" \
            agents/ harness/ packages/ \
            --include="*.py" 2>/dev/null \
            | grep -v "__pycache__" || true)
          if [ -n "$STUBS" ]; then
            echo "🔴 Stubs detected in production code:"
            echo "$STUBS"
            exit 1
          fi
          echo "✅ No stubs"

  dependency-review:
    name: Production dependency audit
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical

  pr-summary:
    name: PR summary comment
    needs: [typecheck, lint, test, build, geo-gate, secret-scan, stub-scan, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              'TypeScript':        '${{ needs.typecheck.result }}',
              'Lint':              '${{ needs.lint.result }}',
              'Tests':             '${{ needs.test.result }}',
              'Build':             '${{ needs.build.result }}',
              'GEO gate':          '${{ needs.geo-gate.result }}',
              'Secret scan':       '${{ needs.secret-scan.result }}',
              'Stub scan':         '${{ needs.stub-scan.result }}',
              'Dependency audit':  '${{ needs.dependency-review.result }}',
            };
            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const allGreen = Object.values(jobs).every(r => ['success','skipped'].includes(r));
            const rows = Object.entries(jobs).map(([k,v]) => `${icon(v)} **${k}**: ${v}`).join('\n');
            const body = [
              '## Quality Gate — Emerald Tablets™',
              '',
              allGreen
                ? '🟢 **All gates green — auto-merge eligible**'
                : '🔴 **Gates failed — fix before merging**',
              '',
              rows,
              '',
              '_SYNTHIA™ floor 8.5/10 · Land the Plane™ v1.1_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
